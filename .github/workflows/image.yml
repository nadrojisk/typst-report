name: Image

# Builds the Docker image, renders the example report through it as a smoke test, and (on main
# and version tags only) publishes it to GHCR. Pull requests build and test but never push.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# A new push to a PR supersedes the run in flight; main and tag runs always finish.
concurrency:
  group: image-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build, test, publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # linux/amd64 only: the Dockerfile downloads the x86_64 Typst binary.
      - name: Build (loaded locally for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: typst-report:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Render the example through the image exactly as a user would, including the D2 diagram
      # (tiago is vendored in the image, so this needs no network) and the figure. Fail on any
      # error or an empty PDF.
      - name: Smoke test
        run: |
          docker run --rm -v "$PWD:/data" -w /data typst-report:ci \
            --resource-path=examples examples/example.md -o /data/smoke.pdf
          test -s smoke.pdf
          head -c 5 smoke.pdf | grep -q '%PDF-'

      - name: Upload the rendered example
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: example-pdf
          path: smoke.pdf
          retention-days: 14

      - name: Version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # Reuses the layers cached above, so this is fast. Skipped on pull requests.
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
